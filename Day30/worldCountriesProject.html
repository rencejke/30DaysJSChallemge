<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30 Days Of JavaScript: Final Projects Part 1 (World Countries Data)</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
    <div class="header-data-wrapper">
     <h1 class="header-data-title">World Countries Data</h1>
     <p class="header-data-countries-length">Currently we have 250 Countries</p>
     <p class="header-data-search-info">5 countries Satisfied the search Criteria</p>
    </div>

    <div class="countries-find-wrapper">
        
        <div class="countries-find-search">
             <input type="text" class="countries-find-search" id="search" placeholder="search counrtries by name, city, and languages">
        </div>
       
        <div class="countries-find-order">
        <button class="countries-find-order-name">Name</button>
        <button class="countries-find-order-capital">Capital</button>
        <button class="countries-find-order-population">Population</button>
        <button class="countries-find-order-chart"><i class="fa-solid fa-chart-line"></i></button>
        </div>
    </div>

<script src="script/main.js"></script>
</body>
</html>
