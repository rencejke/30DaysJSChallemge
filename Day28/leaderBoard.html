<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30 Days of JavaScript Challenge Leaderboard</title>
     <link rel="stylesheet" href="style/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
        <h1>30 Days of JavaScript Challenge Leaderboard</h1>
        <div class="input-data-wrapper">
            <input type="text" class="first-name" placeholder="First Name">
            <input type="text" class="last-name" placeholder="Last Name">
            <input type="text" class="country" placeholder="Country">
            <input type="text" class="country" placeholder="Player Score">
            <button>Add Player</button>
        </div>
        <div class="validation">All Fields Are Required</div>
        <div class="leaderboard-data-wrapper">
            <div class="leaderboard-data-row">
                <div class="leaderboard-data-row-name-date">
                    <div class="name-and-date-wrapper">
                    <p>Martha Yohanes</p>
                    <p>Jan 30 2020 01:09</p>
                    </div>
                    <p class="country">Finland</p>
                </div>
                <div class="leaderboard-country-score">
                <p class="score-data">85</p>
                </div>
                <div class="leader-data-buttons">
                    <button><i class="fa-solid fa-trash"></i></button>
                    <button>+5</button>
                    <button>-5</button>
                </div>
            </div>
        </div>

        <script src="script/script.js"></script>
</body>
</html>
