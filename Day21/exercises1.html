<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>
    <p id ='p1'>test1</p>
    <p id ='p2'>test2</p>
    <p id ='p3'>test3</p>
    <p id ='p4'>test4</p>
</body>
<script>

        //exercises 1

        /*
            Create an index.html file and put four p elements as above:
            Get the first paragraph by using document.querySelector(tagname) and tag name
        */

        const firstParagQuery = document.querySelector('p') 
        const firstParagTag = document.getElementsByTagName('p')
        console.log(firstParagQuery)
        console.log(firstParagTag[0])

        //2
        //Get each of the the paragraph using document.querySelector('#id') and by their id

        const p1 = document.querySelector('#p1')
        const p2 = document.querySelector('#p2')
        const p3 = document.querySelector('#p3')
        const p4 = document.querySelector('#p4')

        console.log(p1)
        console.log(p2)
        console.log(p3)
        console.log(p4)

        //3 Get all the p as nodeList using document.querySelectorAll(tagname) and by their tag name
        const getAllParaQuery = document.querySelectorAll('p')
        const getAllParaTag = document.getElementsByTagName('p')

        console.log(getAllParaQuery)
        console.log(getAllParaTag)

        //4 Loop through the nodeList and get the text content of each paragraph
        const paragraphLength =  getAllParaQuery.length
        
            getAllParaQuery.forEach(paragraphs => {
            console.log(paragraphs)
        })

        for(let i = 0; i < paragraphLength; i++){
            console.log(getAllParaTag[i])
        }
        

        //5 Set a text content to paragraph the fourth paragraph,Fourth Paragraph

        const getAllParaQuery2 = document.querySelectorAll('p')
        
        for(let i = 0; i < getAllParaQuery2.length; i++){
            if(i === 3){
                getAllParaQuery2[i].textContent = 'Fourth Paragraph'
            }
        }

        //5 Set id and class attribute for all the paragraphs using different attribute setting methods
        const getAllParaQuery3 = document.querySelectorAll('p')
        
        for(let i = 0; i < getAllParaQuery2.length; i++){
                getAllParaQuery3[i].setAttribute('id', `para${i + 1}`)
                getAllParaQuery3[i].setAttribute('class', `para${i + 1}`)
        }

</script>
</html>
